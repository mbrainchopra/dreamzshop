spring.application.name=DreamzShop




spring.datasource.url=jdbc:mysql://localhost:3306/dreamz_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.thymeleaf.cache=false


server.port=8080
# Default admin credentials can be overridden with environment variables/properties.
app.admin.email=${ADMIN_EMAIL:admin@dreamzshop.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Local image storage - no external image hosting required.
app.upload.dir=${APP_UPLOAD_DIR:uploads/images}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

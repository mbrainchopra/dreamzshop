<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>


<body>


<nav class="dreamz-nav"
     th:fragment="customerNavbar">

    <div class="container">

        <!-- =====================================================
             MAIN NAVBAR
        ====================================================== -->

        <div class="nav-main">


            <!-- BRAND -->

            <a class="brand"
               th:href="@{/}">

                <span class="brand-symbol">

                    <i class="bi bi-bag-heart-fill"></i>

                </span>

                <span class="brand-name">

                    Dreamz Shop

                </span>

            </a>


            <!-- =================================================
                 DESKTOP MENU
            ================================================== -->

            <div class="desktop-menu d-none d-lg-flex">

                <a th:href="@{/}"
                   class="menu-link">

                    Home

                </a>


                <a th:href="@{/products}"
                   class="menu-link">

                    Shop

                </a>


                <a
                        th:href="@{/customer/orders}"
                        class="menu-link"> 




                   My Orders

                </a>

                <a th:href="@{/products?sort=price-low}"
                   class="menu-link offers-link">

                    <i class="bi bi-tags-fill"></i>

                    Offers

                </a>

            </div>


            <!-- =================================================
                 DESKTOP SEARCH
            ================================================== -->

            <form class="nav-search d-none d-md-flex"
                  th:action="@{/products}"
                  method="get">

                <i class="bi bi-search"></i>

                <input
                        type="search"
                        name="keyword"
                        placeholder="Search products..."
                        autocomplete="off">

            </form>


            <!-- =================================================
                 RIGHT ACTIONS
            ================================================== -->

            <div class="nav-actions d-none d-md-flex">


                <!-- WISHLIST -->

                <a th:href="@{/customer/wishlist}"
                   class="nav-icon"
                   title="Wishlist">

                    <i class="bi bi-heart"></i>

                </a>


                <!-- CART -->

                <a th:href="@{/customer/cart}"
                   class="nav-icon"
                   title="Cart">

                    <i class="bi bi-bag"></i>

                </a>


                <!-- NOTIFICATIONS -->

                <a th:href="@{/customer/notifications}"
                   class="nav-icon notification-icon"
                   title="Notifications">

                    <i class="bi bi-bell"></i>

                    <span
                            th:if="${unreadCount != null and unreadCount > 0}"
                            class="notification-count"
                            th:text="${unreadCount}">

                        0

                    </span>

                </a>


                <!-- PROFILE -->

                <a th:href="@{/customer/profile}"
                   class="profile-icon"
                   title="My Profile">

                    <i class="bi bi-person"></i>

                </a>


            </div>


            <!-- =================================================
                 MOBILE MENU BUTTON
            ================================================== -->

            <button
                    class="mobile-menu d-md-none"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#dreamzMobileMenu"
                    aria-label="Open menu">

                <i class="bi bi-list"></i>

            </button>


        </div>


        <!-- =====================================================
             MOBILE SEARCH
        ====================================================== -->

        <form
                class="mobile-search d-md-none"
                th:action="@{/products}"
                method="get">

            <div class="mobile-search-inner">

                <i class="bi bi-search"></i>

                <input
                        type="search"
                        name="keyword"
                        placeholder="Search products..."
                        autocomplete="off">

            </div>

        </form>


    </div>


    <!-- =========================================================
         MOBILE OFFCANVAS
    ========================================================== -->

    <div
            class="offcanvas offcanvas-end"
            tabindex="-1"
            id="dreamzMobileMenu">


        <!-- HEADER -->

        <div class="offcanvas-header">

            <div class="mobile-brand">

                <span class="brand-symbol">

                    <i class="bi bi-bag-heart-fill"></i>

                </span>

                <span>

                    Dreamz Shop

                </span>

            </div>


            <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas">
            </button>

        </div>


        <!-- BODY -->

        <div class="offcanvas-body">


            <!-- HOME -->

            <a
                    th:href="@{/}"
                    class="mobile-link">

                <span>

                    <i class="bi bi-house-door"></i>

                    Home

                </span>

                <i class="bi bi-chevron-right"></i>

            </a>


            <!-- SHOP -->

            <a
                    th:href="@{/products}"
                    class="mobile-link">

                <span>

                    <i class="bi bi-grid"></i>

                    Shop

                </span>

                <i class="bi bi-chevron-right"></i>

            </a>


            <!-- WISHLIST -->

            <a
                    th:href="@{/customer/wishlist}"
                    class="mobile-link">

                <span>

                    <i class="bi bi-heart"></i>

                    Wishlist

                </span>

                <i class="bi bi-chevron-right"></i>

            </a>


            <!-- CART -->

            <a
                    th:href="@{/customer/cart}"
                    class="mobile-link">

                <span>

                    <i class="bi bi-bag"></i>

                    Cart

                </span>

                <i class="bi bi-chevron-right"></i>

            </a>


            <!-- ORDERS -->

            <a
                    th:href="@{/customer/orders}"
                    class="mobile-link">

                <span>

                    <i class="bi bi-box-seam"></i>

                    My Orders

                </span>

                <i class="bi bi-chevron-right"></i>

            </a>


            <!-- NOTIFICATIONS -->

            <a
                    th:href="@{/customer/notifications}"
                    class="mobile-link">

                <span>

                    <i class="bi bi-bell"></i>

                    Notifications

                </span>

                <span
                        th:if="${unreadCount != null and unreadCount > 0}"
                        class="mobile-notification"
                        th:text="${unreadCount}">

                    0

                </span>

            </a>


            <!-- ACCOUNT -->

            <div class="mobile-heading">

                ACCOUNT

            </div>


            <!-- PROFILE -->

            <a
                    th:href="@{/customer/profile}"
                    class="mobile-link">

                <span>

                    <i class="bi bi-person"></i>

                    My Profile

                </span>

                <i class="bi bi-chevron-right"></i>

            </a>


            <!-- ADDRESSES -->

            <a
                    th:href="@{/customer/addresses}"
                    class="mobile-link">

                <span>

                    <i class="bi bi-geo-alt"></i>

                    Addresses

                </span>

                <i class="bi bi-chevron-right"></i>

            </a>


            <!-- REVIEWS -->

            <a
                    th:href="@{/customer/reviews}"
                    class="mobile-link">

                <span>

                    <i class="bi bi-star"></i>

                    Reviews

                </span>

                <i class="bi bi-chevron-right"></i>

            </a>


            <!-- RETURNS -->

            <a
                    th:href="@{/customer/returns}"
                    class="mobile-link">

                <span>

                    <i class="bi bi-arrow-return-left"></i>

                    Returns

                </span>

                <i class="bi bi-chevron-right"></i>

            </a>


            <!-- REFUNDS -->

            <a
                    th:href="@{/customer/refunds}"
                    class="mobile-link">

                <span>

                    <i class="bi bi-cash-stack"></i>

                    Refunds

                </span>

                <i class="bi bi-chevron-right"></i>

            </a>


            <div class="mobile-divider"></div>


            <!-- LOGOUT -->

            <form
                    th:action="@{/logout}"
                    method="post">

                <input
                        type="hidden"
                        name="_csrf"
                        th:value="${_csrf.token}">


                <button
                        type="submit"
                        class="mobile-logout">

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </button>

            </form>


        </div>

    </div>


    <!-- =========================================================
         NAVBAR CSS
    ========================================================== -->

    <style>

        /* =====================================================
           DREAMZ SHOP COLOR SYSTEM
        ====================================================== */

        :root {

            --dreamz-green: #16A34A;

            --dreamz-green-dark: #15803D;

            --dreamz-green-light: #DCFCE7;

            --dreamz-green-soft: #F0FDF4;

            --dreamz-background: #F7FAF8;

            --dreamz-text: #17211B;

            --dreamz-muted: #647067;

            --dreamz-border: #E2E8E4;

            --dreamz-white: #FFFFFF;

        }


        * {
            box-sizing: border-box;
        }


        /* =====================================================
           NAVBAR
        ====================================================== */

        .dreamz-nav {

            position: sticky;

            top: 0;

            z-index: 1030;

            background: var(--dreamz-white);

            border-bottom: 1px solid var(--dreamz-border);

            box-shadow:
                    0 3px 18px rgba(22, 163, 74, 0.07);

        }


        /* =====================================================
           MAIN
        ====================================================== */

        .nav-main {

            min-height: 72px;

            display: flex;

            align-items: center;

            gap: 28px;

        }


        /* =====================================================
           BRAND
        ====================================================== */

        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

            text-decoration: none;

            color: var(--dreamz-text);

            white-space: nowrap;

        }


        .brand-symbol {

            width: 40px;

            height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 11px;

            background:
                    linear-gradient(
                            135deg,
                            var(--dreamz-green),
                            var(--dreamz-green-dark)
                    );

            color: var(--dreamz-white);

            font-size: 18px;

            box-shadow:
                    0 5px 14px rgba(22, 163, 74, 0.22);

            transition: 0.25s ease;

        }


        .brand:hover .brand-symbol {

            transform: rotate(-5deg) scale(1.05);

            box-shadow:
                    0 7px 18px rgba(22, 163, 74, 0.28);

        }


        .brand-name {

            font-size: 20px;

            font-weight: 800;

            letter-spacing: -0.4px;

            color: var(--dreamz-text);

        }


        .brand:hover .brand-name {

            color: var(--dreamz-green-dark);

        }


        /* =====================================================
           DESKTOP MENU
        ====================================================== */

        .desktop-menu {

            align-items: center;

            gap: 23px;

        }


        .menu-link {

            position: relative;

            text-decoration: none;

            color: var(--dreamz-muted);

            font-size: 14px;

            font-weight: 600;

            padding: 26px 0;

            white-space: nowrap;

            transition:
                    color 0.2s ease;

        }


        .menu-link::after {

            content: "";

            position: absolute;

            left: 0;

            right: 0;

            bottom: 17px;

            height: 2px;

            border-radius: 10px;

            background: var(--dreamz-green);

            transform: scaleX(0);

            transform-origin: center;

            transition:
                    transform 0.25s ease;

        }


        .menu-link:hover {

            color: var(--dreamz-green-dark);

        }


        .menu-link:hover::after {

            transform: scaleX(1);

        }


        /* =====================================================
           OFFERS
        ====================================================== */

        .offers-link {

            color: var(--dreamz-green-dark);

            display: inline-flex;

            align-items: center;

            gap: 5px;

        }


        .offers-link i {

            color: var(--dreamz-green);

            font-size: 13px;

        }


        .offers-link:hover {

            color: var(--dreamz-green);

        }


        /* =====================================================
           SEARCH
        ====================================================== */

        .nav-search {

            height: 44px;

            flex: 1;

            max-width: 360px;

            margin-left: auto;

            display: flex;

            align-items: center;

            background: var(--dreamz-background);

            border: 1px solid var(--dreamz-border);

            border-radius: 12px;

            padding: 0 14px;

            transition:
                    border-color 0.2s ease,
                    box-shadow 0.2s ease,
                    background 0.2s ease;

        }


        .nav-search:focus-within {

            background: var(--dreamz-white);

            border-color: var(--dreamz-green);

            box-shadow:
                    0 0 0 4px rgba(22, 163, 74, 0.10);

        }


        .nav-search i {

            color: var(--dreamz-green);

            font-size: 16px;

        }


        .nav-search input {

            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            padding: 0 10px;

            font-size: 13px;

            color: var(--dreamz-text);

        }


        .nav-search input::placeholder {

            color: #8A948D;

        }


        /* =====================================================
           ACTIONS
        ====================================================== */

        .nav-actions {

            align-items: center;

            gap: 5px;

        }


        .nav-icon,
        .profile-icon {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            border-radius: 11px;

            text-decoration: none;

            color: var(--dreamz-text);

            transition:
                    background 0.2s ease,
                    color 0.2s ease,
                    transform 0.2s ease;

        }


        .nav-icon i,
        .profile-icon i {

            font-size: 19px;

        }


        .nav-icon:hover,
        .profile-icon:hover {

            background: var(--dreamz-green-light);

            color: var(--dreamz-green-dark);

            transform: translateY(-1px);

        }


        /* =====================================================
           NOTIFICATION
        ====================================================== */

        .notification-count {

            position: absolute;

            top: 1px;

            right: 0;

            min-width: 17px;

            height: 17px;

            padding: 0 4px;

            border-radius: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #DC3545;

            color: #FFFFFF;

            border: 2px solid #FFFFFF;

            font-size: 8px;

            font-weight: 800;

        }


        /* =====================================================
           MOBILE MENU BUTTON
        ====================================================== */

        .mobile-menu {

            margin-left: auto;

            width: 42px;

            height: 42px;

            border: 1px solid var(--dreamz-border);

            border-radius: 11px;

            background: var(--dreamz-white);

            color: var(--dreamz-green-dark);

            font-size: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                    background 0.2s ease,
                    border-color 0.2s ease;

        }


        .mobile-menu:hover {

            background: var(--dreamz-green-light);

            border-color: #B7E4C5;

        }


        /* =====================================================
           MOBILE SEARCH
        ====================================================== */

        .mobile-search {

            padding-bottom: 13px;

        }


        .mobile-search-inner {

            height: 44px;

            display: flex;

            align-items: center;

            gap: 9px;

            background: var(--dreamz-background);

            border: 1px solid var(--dreamz-border);

            border-radius: 12px;

            padding: 0 14px;

            transition:
                    border-color 0.2s ease,
                    box-shadow 0.2s ease;

        }


        .mobile-search-inner:focus-within {

            background: #FFFFFF;

            border-color: var(--dreamz-green);

            box-shadow:
                    0 0 0 4px rgba(22, 163, 74, 0.09);

        }


        .mobile-search-inner i {

            color: var(--dreamz-green);

        }


        .mobile-search-inner input {

            flex: 1;

            border: none;

            outline: none;

            background: transparent;

            font-size: 13px;

            color: var(--dreamz-text);

        }


        /* =====================================================
           MOBILE OFFCANVAS
        ====================================================== */

        .offcanvas {

            max-width: 330px;

            background: var(--dreamz-white);

        }


        .offcanvas-header {

            border-bottom: 1px solid var(--dreamz-border);

            padding: 18px;

        }


        .mobile-brand {

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 19px;

            font-weight: 800;

            color: var(--dreamz-text);

        }


        .mobile-brand .brand-symbol {

            width: 35px;

            height: 35px;

            font-size: 16px;

        }


        /* =====================================================
           MOBILE LINKS
        ====================================================== */

        .mobile-link {

            min-height: 52px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            text-decoration: none;

            color: var(--dreamz-text);

            border-bottom: 1px solid #EEF2EF;

            font-size: 14px;

            font-weight: 600;

            transition:
                    background 0.2s ease,
                    color 0.2s ease,
                    padding-left 0.2s ease;

        }


        .mobile-link span:first-child {

            display: flex;

            align-items: center;

            gap: 13px;

        }


        .mobile-link span:first-child i {

            width: 22px;

            text-align: center;

            color: var(--dreamz-green);

            font-size: 17px;

        }


        .mobile-link > i {

            color: #9AA59E;

            font-size: 13px;

        }


        .mobile-link:hover {

            background: var(--dreamz-green-soft);

            color: var(--dreamz-green-dark);

            padding-left: 6px;

        }


        .mobile-link:hover > i {

            color: var(--dreamz-green);

        }


        /* =====================================================
           ACCOUNT HEADING
        ====================================================== */

        .mobile-heading {

            margin-top: 25px;

            margin-bottom: 3px;

            color: var(--dreamz-green-dark);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.2px;

        }


        /* =====================================================
           MOBILE NOTIFICATION
        ====================================================== */

        .mobile-notification {

            min-width: 21px;

            height: 21px;

            padding: 0 5px;

            border-radius: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #DC3545;

            color: white;

            font-size: 9px;

            font-weight: 700;

        }


        /* =====================================================
           DIVIDER
        ====================================================== */

        .mobile-divider {

            border-top: 1px solid var(--dreamz-border);

            margin: 20px 0;

        }


        /* =====================================================
           LOGOUT
        ====================================================== */

        .mobile-logout {

            width: 100%;

            border: 1px solid #B7E4C5;

            background: var(--dreamz-green-soft);

            color: var(--dreamz-green-dark);

            border-radius: 11px;

            padding: 12px;

            font-size: 14px;

            font-weight: 700;

            transition:
                    background 0.2s ease,
                    color 0.2s ease,
                    transform 0.2s ease;

        }


        .mobile-logout i {

            margin-right: 6px;

        }


        .mobile-logout:hover {

            background: var(--dreamz-green);

            color: #FFFFFF;

            transform: translateY(-1px);

        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 1199px) {

            .nav-main {

                gap: 18px;

            }


            .desktop-menu {

                gap: 16px;

            }


            .nav-search {

                max-width: 280px;

            }

        }


        @media (max-width: 767px) {

            .nav-main {

                min-height: 64px;

            }


            .brand-name {

                font-size: 19px;

            }


            .brand-symbol {

                width: 36px;

                height: 36px;

            }

        }

    </style>


</nav>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>

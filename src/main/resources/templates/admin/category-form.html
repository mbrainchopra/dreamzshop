<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${category.id == null ? 'Add Category' : 'Edit Category'} + ' | Dreamz Shop Admin'">Category | Dreamz Shop Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-common.css}">
</head>
<body>

<div th:replace="~{fragments/admin-layout :: admin-layout}"></div>

<main class="container-fluid px-3 px-lg-4 py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <div class="text-uppercase fw-bold small text-success" style="letter-spacing:1.2px">Catalog</div>
            <h2 class="fw-bold mb-1" th:text="${category.id == null ? 'Add Category' : 'Edit Category'}">Add Category</h2>
            <p class="text-secondary mb-0">Create a clean category structure for your products.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/admin/categories}">
            <i class="bi bi-arrow-left me-1"></i> Back to Categories
        </a>
    </div>

    <div class="card border-0 p-4 p-lg-5">
        <form th:action="${category.id == null ? '/admin/categories/save' : '/admin/categories/update/' + category.id}"
              th:object="${category}"
              method="post">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="row g-4">
                <div class="col-lg-8">
                    <label class="form-label fw-semibold">Category Name <span class="text-danger">*</span></label>
                    <input type="text"
                           class="form-control form-control-lg"
                           th:field="*{name}"
                           maxlength="100"
                           placeholder="e.g. Electronics"
                           required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    <div class="text-danger small mt-1" th:if="${nameError}" th:text="${nameError}"></div>
                </div>

                <div class="col-lg-4">
                    <label class="form-label fw-semibold">Status</label>
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" role="switch" id="enabled" th:field="*{enabled}">
                        <label class="form-check-label" for="enabled">Enabled</label>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea class="form-control"
                              rows="5"
                              th:field="*{description}"
                              maxlength="500"
                              placeholder="Short description for this category"></textarea>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Image URL</label>
                    <input
                           class="form-control"
                           th:field="*{image}"
                           maxlength="500"
                           placeholder="https://example.com/category.jpg">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-4 border-top">
                <a class="btn btn-light border" th:href="@{/admin/categories}">Cancel</a>
                <button type="submit" class="btn btn-success px-4">
                    <i class="bi bi-check-lg me-1"></i>
                    <span th:text="${category.id == null ? 'Create Category' : 'Update Category'}">Create Category</span>
                </button>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/admin-common.js}"></script>
</body>
</html>

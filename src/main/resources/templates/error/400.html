<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bad Request | Dreamz Shop</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            background: #f5f6f8;
        }

        .error-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-card {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 25px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .error-code {
            font-size: 90px;
            font-weight: 900;
            line-height: 1;
        }

        .error-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="error-wrapper">

    <div class="error-card">

        <div class="error-icon">
            ⚠️
        </div>

        <div class="error-code">
            400
        </div>

        <h2 class="mt-3">
            Bad Request
        </h2>

        <p class="text-muted">
            <span th:text="${message}">
                The request could not be processed.
            </span>
        </p>

        <a
                th:href="@{/}"
                class="btn btn-dark px-4">

            Back to Dreamz Shop

        </a>

    </div>

</div>

</body>

</html>
